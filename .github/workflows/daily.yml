name: Hourly vacancy search and publish
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: career-hub-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            vacancy_cache.json
            push_seen.json
            link_health_cache.json
            discovered_boards.json
          key: vacancy-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vacancy-cache-
      - name: Validate website code
        run: python tests/check_release.py
      - name: Refresh public vacancy data
        run: python update_vacancies.py
      - name: Check supported application links
        run: python link_health.py
        continue-on-error: true
      - name: Configure public feedback repository
        run: |
          python -c 'import json, os, pathlib; pathlib.Path("site/feedback-repo.js").write_text("window.CAREER_FEEDBACK_REPOSITORY = " + json.dumps(os.environ["GITHUB_REPOSITORY"]) + ";\n")'
      - name: Generate public vacancy and employer pages
        run: python generate_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
